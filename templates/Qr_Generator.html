{% extends "layout.html" %}
{% block content %}

<div class="page-container">
    <div class="qr-layout">
        <div class="qr-box">
            <img src="{{ url_for('qr_image') }}" alt="Código QR de NetDrop" class="qr-img">
        </div>

        <div class="qr-details">
            <h1 class="page-title">Escanear para conectar</h1>
            <p class="page-subtitle">Apunta con la cámara de tu teléfono móvil conectado a la misma red Wi-Fi para acceder a NetDrop en el navegador.</p>
            
            <div class="qr-actions">
                <a class="btn-primary" href="/qr">Generar nuevo QR</a>
                <a class="btn-subtle" href="/">Ver archivos</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
